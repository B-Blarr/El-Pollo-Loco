<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Pollo Loco</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./classes/drawable-object.class.js" defer></script>
    <script src="./classes/status-bar.class.js" defer></script>
    <script src="./classes/health-bar.class.js" defer></script>
    <script src="./classes/bottle-bar.class.js" defer></script>
    <script src="./classes/coin-bar.class.js" defer></script>
    <script src="./classes/endboss-health-bar.class.js" defer></script>
    <script src="./classes/moveable-object.class.js" defer></script>
    <script src="./classes/collectable-object.class.js" defer></script>
    <script src="./classes/bottle-in-air.class.js" defer></script>
    <script src="./classes/bottle-on-ground.class.js" defer></script>
    <script src="./classes/coin.class.js" defer></script>
    <script src="./classes/interval-hub.class.js" defer></script>
    <script src="./classes/background-object.class.js" defer></script>
    <script src="./classes/image-hub.class.js" defer></script>
    <script src="./classes/chicken.class.js" defer></script>
    <script src="./classes/baby-chicken.class.js" defer></script>
    <script src="./classes/character.class.js" defer></script>
    <script src="./classes/world.class.js" defer></script>
    <script src="./classes/endboss.class.js" defer></script>
    <script src="./classes/cloud.class.js" defer></script>
    <script src="./classes/throwable-object.class.js" defer></script>
    <script src="./classes/keyboard.class.js" defer></script>
    <script src="./classes/level.class.js" defer></script>
    <script src="./levels/level1.js" defer></script>
    <script src="./js/game.js" defer></script>
  </head>
  <body>
    <div id="fullscreen">
      <div id="start-screen" class="start-screen-overlay">
        <button id="start_btn" onclick="startGame()">Spiel Starten</button>
        <img src="./assets/img/9_intro_outro_screens/start/startscreen_1.png" alt="start-screen" />
        <section class="button-area">
          <div class="sound-area">
            <div>
              <button onclick="AudioHub.mute()">mute</button>
              <button onclick="AudioHub.unmute()">unmute</button>
            </div>
            <section class="audio_slider">
              <input type="range" oninput="AudioHub.objSetVolume(AudioHub.allSounds)" id="volume" min="0" max="1" step="0.01" value="0.2" />
            </section>
          </div>
          <article class="explanation">
            <p>"A" oder "<==" = Nach links. "D" oder "==>" = Nach rechts.</p>
            <p></p>
            <p>"Leertaste" = Springen. "F" = Werfen.</p>
          </article>
          <div class="toggle-fullscreen">
            <button id="fullscreen-toggle-button" onclick="fullscreen()">Fullscreen</button>
            <button id="window-toggle-button" class="d-none" onclick="exitFullscreen()">Window-Modus</button>
          </div>
        </section>
      </div>

      <div id="winning-screen" class="winning-screen-overlay d-none"></div>

      <div id="game-over-screen" class="game-over-overlay d-none">
        <img src="assets/img/9_intro_outro_screens/game_over/game over!.png" alt="game-over" />
      </div>

      <h1>El Pollo Loco</h1>

      <canvas id="canvas" width="1440" height="960"></canvas>
      <section class="button-area">
        <div class="sound-area">
          <div>
            <button onclick="AudioHub.mute()">mute</button>
            <button onclick="AudioHub.unmute()">unmute</button>
          </div>
          <section class="audio_slider">
            <input type="range" oninput="AudioHub.objSetVolume(AudioHub.allSounds)" id="volume" min="0" max="1" step="0.01" value="0.2" />
          </section>
        </div>
        <article class="explanation">
          <p>"A" oder "<==" = Nach links. "D" oder "==>" = Nach rechts.</p>
          <p></p>
          <p>"Leertaste" = Springen. "F" = Werfen.</p>
        </article>
        <div class="toggle-fullscreen">
          <button id="ingame-fullscreen-toggle-button" onclick="fullscreen()">Fullscreen</button>
          <button id="ingame-window-toggle-button" class="d-none" onclick="exitFullscreen()">Window-Modus</button>
        </div>
      </section>
    </div>
  </body>
</html>
