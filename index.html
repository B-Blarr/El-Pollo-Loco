<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Pollo Loco</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./classes/drawable-object.class.js" defer></script>
    <script src="./classes/status-bar.class.js" defer></script>
    <script src="./classes/health-bar.class.js" defer></script>
    <script src="./classes/bottle-bar.class.js" defer></script>
    <script src="./classes/coin-bar.class.js" defer></script>
    <script src="./classes/endboss-health-bar.class.js" defer></script>
    <script src="./classes/moveable-object.class.js" defer></script>
    <script src="./classes/collectable-object.class.js" defer></script>
    <script src="./classes/bottle-in-air.class.js" defer></script>
    <script src="./classes/bottle-on-ground.class.js" defer></script>
    <script src="./classes/coin.class.js" defer></script>
    <script src="./classes/interval-hub.class.js" defer></script>
    <script src="./classes/background-object.class.js" defer></script>
    <script src="./classes/image-hub.class.js" defer></script>
    <script src="./classes/chicken.class.js" defer></script>
    <script src="./classes/baby-chicken.class.js" defer></script>
    <script src="./classes/character.class.js" defer></script>
    <script src="./classes/world.class.js" defer></script>
    <script src="./classes/endboss.class.js" defer></script>
    <script src="./classes/cloud.class.js" defer></script>
    <script src="./classes/throwable-object.class.js" defer></script>
    <script src="./classes/keyboard.class.js" defer></script>
    <script src="./classes/level.class.js" defer></script>
    <script src="./levels/level1.js" defer></script>
    <script src="./classes/AudioHub.class.js"></script>
    <script src="./classes/AudioError.class.js"></script>
    <script src="./js/game.js" defer></script>
    <link rel="shortcut icon" href="./assets/icons/favicon.png" type="image/x-icon">
  </head>
  <body>
    <!-- Fullscreen -->
    <div id="fullscreen">
      <div id="start-screen" class="start-screen-overlay">
        <div class="start-image-wrapper">
          <div class="menu-container">
            <img onclick="openOptions()" src="./assets/icons/optionen.png" class="menu-btn small-btn" alt="Optionen" />
            <img onclick="openControls()" src="./assets/icons/steuerung.png" class="menu-btn small-btn" alt="Steuerung" />
            <img onclick="startGame()" src="./assets/icons/startbutton7.png" class="menu-btn start-btn" alt="Start" />
          </div>

          <img class="start-bg" src="./assets/img/9_intro_outro_screens/start/startscreen_1.png" alt="start-screen" />
        </div>
        
      </div>

      <!-- Winning Screen -->
      <div id="winning-screen" class="winning-screen-overlay d-none">
        <div class="end-buttons">
          <button onclick="openStartscreen()"><img class="overlay-button-images" src="./assets/icons/start-menu-button.png" alt="startscreen"></button>
          <button onclick="startGame()"><img class="overlay-button-images" src="./assets/icons/restart-button.png" alt="restart"></button>
          <!-- <button class="d-none">Nächstes Level</button>  -->
          <button><img class="overlay-button-images" src="./assets/icons/next-level-button.png" alt="next-level"></button> 
        </div>
        <img src="./assets/img/You won, you lost/You Win A.png" alt="winning screen" />
      </div>

      <!-- Game Over Screen -->
      <div id="game-over-screen" class="game-over-overlay d-none">
        <div class="end-buttons">
          <button onclick="openStartscreen()"><img src="./assets/icons/start-menu-button.png" alt="startscreen"></button>
          <button onclick="startGame()"><img src="./assets/icons/restart-button.png" alt="restart"></button>
          <!-- <button class="d-none">Nächstes Level</button>  -->
          <!-- <button><img src="./assets/icons/next-level-button.png" alt="next-level"></button>  -->
        </div>
        <img src="assets/img/9_intro_outro_screens/game_over/game over!.png" alt="game-over" />
      </div>

      <!-- Steuerung Screen -->
      <div id="controls-overlay" class="info-overlay d-none" onclick="closeControls()">
        <img src="assets/img/5_background/control-explanation.png" alt="Steuerung Erklärung" />
      </div>

      <!-- Options Screen -->

      <div id="controls-overlay" class="info-overlay d-none" onclick="closeControls()">
        <img src="assets/img/5_background/control-explanation.png" alt="Steuerung Erklärung" />
      </div>

      <div id="options-overlay" class="info-overlay d-none" onclick="closeOptions()">
        <div class="options-card" onclick="event.stopPropagation()">
          <h2>Einstellungen</h2>
          
          <div class="option-row">
            <span>Sound</span>
            <div class="icon-group">
                <button class="menu-icon-btn" onclick="AudioHub.mute()">🔇 Aus</button>
                <button class="menu-icon-btn" onclick="AudioHub.unmute()">🔊 An</button>
            </div>
            <input type="range" oninput="AudioHub.objSetVolume(AudioHub.allSounds)" id="volume-slider-menu" min="0" max="1" step="0.01" value="0.2" />
          </div>

          <div class="option-row">
             <span>Ansicht</span>
             <button id="enter-fullscreen" class="menu-icon-btn" onclick="fullscreen()">⛶ Vollbild</button>
             <button id="exit-fullscreen" class="menu-icon-btn d-none" onclick="exitFullscreen()">⛶ Fenstermodus</button>
          </div>

          <div class="option-row">
            <span>Infos</span>
            <button class="menu-icon-btn" onclick="openImpressum()">Impressum</button>
          </div>

          <button class="close-btn" onclick="closeOptions()">Schließen</button>
        </div>
      </div>

      <div id="impressum-overlay" class="info-overlay d-none" onclick="closeImpressum()">
         <div class="options-card" onclick="event.stopPropagation()">
            <h2>Impressum</h2>
            <div class="impressum-text">
                <p><strong>El Pollo Loco</strong></p>
                <p>Entwickelt von: Benjamin Blarr</p>
                <p>Lindenweg 2</p>
                <p>38364 Schöningen</p>
                <p>E-Mail: b.blarr@gmx.de</p> 
            </div>
            <button class="close-btn" onclick="closeImpressum()">Zurück</button>
         </div>
      </div>

      <!-- Canvas Ingame -->
      <h1>El Pollo Loco</h1>
      <section class="canvas-section">
        <canvas id="canvas" width="1440" height="960"></canvas>
        <div class="ingame-mute">
         <img id="mute-button" class="hud-button" src="assets/icons/unmute.png" onclick="toggleMute()">
    </div>
      </section>
    </div>
  </body>
</html>
